name: init-load

# 초기 적재는 수동 실행 (Actions 탭 > init-load > Run workflow)
# 중간에 끊기거나 호출 한도로 멈추면 다시 실행하면 이어서 받습니다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "확보할 거래일 수"
        default: "200"
      max_calls:
        description: "이번 실행의 KRX API 최대 호출 수 (나눠 받으려면 작게)"
        default: "600"

concurrency:
  group: krx-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Initial load
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python init_load.py --days "${{ inputs.days }}" --max-calls "${{ inputs.max_calls }}"

      - name: Commit status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ || true
          if ! git diff --cached --quiet; then
            git commit -m "status: init $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase && git push
          fi
